summary = "declared fan-out shape arms: add, remove, list"

[[layers.containers.components]]
name = "cmd-notes"
kind = "primitive"
path = "crates/harna-cli/src/commands/notes.rs"
summary = "review checklist and release draft arms"

[[layers.containers.components]]
name = "cmd-terms"
kind = "primitive"
path = "crates/harna-cli/src/commands/terms.rs"
summary = "glossary arms: add, remove, list"

[[layers.containers.components]]
name = "cmd-non-goal"
kind = "primitive"
path = "crates/harna-cli/src/commands/non_goal.rs"
summary = "decline register arms: add, remove, list"

[[layers.containers.components]]
name = "cmd-lesson"

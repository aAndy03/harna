summary = "the ROADMAP's data structs (0.3.28): declared milestones with states (declared|current|done|dropped); coherence + reached() feeding milestone-keyed deferred reviews; status/onboarding surface the NOW"
tests = ["crates/harna-core/src/schema/registers/roadmap.rs"]

[[layers.containers.components]]

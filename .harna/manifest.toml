schema_version = 1

# Architecture of harna itself, managed by harna.
# layers contain containers; containers contain primitive/compound components.
# Layers carry a role (0.3.25): base | engine | gateway | orchestration-async |
# orchestration-sync | transit | interface | context - containers inherit it
# unless they declare their own. The vocabulary lives in schema/manifest.rs
# (ROLES); the role-keyed checks live in conformance (validate-roles).
# Components register their tests (`tests = [...]`): registered tests earn
# their keep - `validate --changed` holds changed components to them.
[[layers]]
name = "memory"
description = "everything harna knows lives in the repository, versioned in git"
role = "base"

[[layers.containers]]
name = "schema"
path = "crates/harna-core/src/schema"
description = "data model: manifest, rules, storage, schema migration, glossary, decline register, dead-ends register, roadmap"
gateway = "fs:write"

[[layers.containers.components]]
name = "manifest"
kind = "primitive"
path = "crates/harna-core/src/schema/model/manifest.rs"
summary = "layers -> containers -> primitive/compound components"
tests = ["crates/harna-core/src/schema/model/manifest.rs"]

[[layers.containers.components]]
name = "rules"
kind = "primitive"
path = "crates/harna-core/src/schema/model/rules.rs"
summary = "scoped coding rules with rationale, origin, env and check severity overrides"
tests = ["crates/harna-core/src/schema/model/rules.rs"]

[[layers.containers.components]]
name = "decision-log"
kind = "primitive"
path = "crates/harna-core/src/schema/journal/decisions.rs"
summary = "decision records as data: supersedes chains, superseded decisions visibly dead"
tests = ["crates/harna-core/src/schema/journal/decisions.rs"]

[[layers.containers.components]]
name = "handoff"
kind = "primitive"
path = "crates/harna-core/src/schema/journal/handoff.rs"
summary = "the burst journal: recorded before compaction, carried by onboarding/status to the next session"
tests = ["crates/harna-core/src/schema/journal/handoff.rs"]

[[layers.containers.components]]
name = "store"
kind = "primitive"
path = "crates/harna-core/src/schema/store.rs"
summary = ".harna/ handle: TOML persistence, digest, decisions"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "store-registers"
kind = "primitive"
path = "crates/harna-core/src/schema/store/register_io.rs"
summary = "the declared registers and ledgers the store persists: templates, deferrals, glossary, non-goals, lessons, roadmap, advisory ledger, archive, scores, decisions"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "store-digest-io"
kind = "primitive"
path = "crates/harna-core/src/schema/store/digest_io.rs"
summary = "the sharded code map on disk: index + shards, streamed reads, atomic writes, orphan cleanup"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "scope"
kind = "primitive"
path = "crates/harna-core/src/schema/model/scope.rs"
summary = "the one path-scope test: rule scopes, container paths and template scopes match on whole segments, spellings normalized"

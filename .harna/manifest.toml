kind = "primitive"
path = "crates/harna-core/src/schema/registers/ledgers/baselines.rs"
summary = "the ratchet ledger data (.harna/baselines.toml): allowed error count per (check, file) (0.3.44)"
tests = ["crates/harna-core/src/enforcement/validate/ratchet/tests.rs"]

[[layers.containers.components]]
name = "acknowledged-data"
kind = "primitive"
path = "crates/harna-core/src/schema/registers/ledgers/acknowledged.rs"
summary = "the ADVISORY LEDGER's data structs (0.3.31): accepted Info findings (check + file) locked away with a reason; errors are never acknowledgeable"
tests = ["crates/harna-core/src/schema/registers/ledgers/acknowledged.rs"]

[[layers.containers.components]]
name = "commands-data"
kind = "primitive"
path = "crates/harna-core/src/schema/registers/commands.rs"
summary = "the command registry data: what to run, what it proves, where (0.3.46)"

[[layers.containers.components]]
name = "qualities-data"
kind = "primitive"
path = "crates/harna-core/src/schema/registers/qualities.rs"
summary = "the qualities register (0.4.0): long-term intent as data — statement, measure, category, scope, why; in_scope for briefings"
tests = ["crates/harna-core/src/schema/registers/qualities/tests.rs"]

[[layers.containers.components]]
name = "plugins-data"

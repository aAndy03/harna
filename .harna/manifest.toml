[[layers.containers.components]]
name = "services-data"
kind = "primitive"
path = "crates/harna-core/src/schema/store/services.rs"
summary = "services as data (0.8.0): services.toml model and store IO"

[[layers]]
name = "search"
description = "compressed, queryable views of the codebase"
role = "engine"
depends_on = ["memory"]

[[layers.containers]]
name = "code-map"
path = "crates/harna-core/src/search"
description = "signatures only, never file bodies"
sequence = [
    "digest",
    "digest-resolve",
    "digest-extract",
    "digest-live",
    "digest-crates",
    "diff",
    "dependents",
    "whereis",
    "metrics",
    "hotspots",
    "digest-tree",
    "digest-tree-decls",
    "api-surface",
    "ts-reader",
]
gateway = "process"

[[layers.containers.components]]
name = "digest"
kind = "primitive"
path = "crates/harna-core/src/search/digest.rs"
summary = "the .harna/digest.json map: signatures + internal deps; agents query it instead of rescanning"
tests = ["crates/harna-core/src/search/digest/tests.rs"]

[[layers.containers.components]]
name = "digest-resolve"
kind = "primitive"
path = "crates/harna-core/src/search/digest/resolve.rs"
summary = "workspace crates and dependency resolution: the single resolver fan-out, layer boundaries and dependents share"
tests = ["crates/harna-core/src/search/digest/tests.rs"]

[[layers.containers.components]]
name = "digest-extract"
kind = "primitive"
path = "crates/harna-core/src/search/digest/extract.rs"
summary = "one Rust file into a map module: internal deps, declared names and mods, body hash; whole test files carry no deps (0.3.37)"

[[layers.containers.components]]
name = "cli-main"
kind = "primitive"
path = "crates/harna-cli/src/main.rs"
summary = "dispatch: one arm per subcommand; every subcommand engine lives in commands/ (0.3.31 dispatch-split)"

[[layers.containers.components]]
name = "cli-args"
kind = "primitive"
path = "crates/harna-cli/src/cli.rs"
summary = "the command line surface as clap declarations (subcommands, arguments, help) — main.rs dispatches (0.3.37 split)"

[[layers.containers]]
name = "cli-commands"

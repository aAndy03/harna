kind = "primitive"
path = "crates/harna-core/src/search/digest/tree/decls.rs"
summary = "the files a Rust source declares: mod (test-gated, nested, r#), #[path]/#[cfg_attr(path)] (multi-line), include! — what the module tree follows"
tests = ["crates/harna-core/src/search/digest/tree/decls/tests.rs"]

[[layers.containers.components]]

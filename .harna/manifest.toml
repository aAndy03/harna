schema_version = 1

# Architecture of harna itself, managed by harna.
# layers contain containers; containers contain primitive/compound components.
# Layers carry a role (0.3.25): base | engine | gateway | orchestration-async |
# orchestration-sync | transit | interface | context - containers inherit it
# unless they declare their own. The vocabulary lives in schema/manifest.rs
# (ROLES); the role-keyed checks live in conformance (validate-roles).
# Components register their tests (`tests = [...]`): registered tests earn
# their keep - `validate --changed` holds changed components to them.

[[layers]]
name = "memory"
role = "base"
description = "everything harna knows lives in the repository, versioned in git"
depends_on = []

[[layers.containers]]
name = "schema"
path = "crates/harna-core/src/schema"
description = "data model: manifest, rules, storage, schema migration, glossary, decline register, dead-ends register, roadmap"
gateway = "fs:write"

[[layers.containers.components]]
name = "manifest"
kind = "primitive"
path = "crates/harna-core/src/schema/manifest.rs"
summary = "layers -> containers -> primitive/compound components"
tests = ["crates/harna-core/src/schema/manifest.rs"]

[[layers.containers.components]]
name = "rules"
kind = "primitive"
path = "crates/harna-core/src/schema/rules.rs"
summary = "scoped coding rules with rationale, origin, env and check severity overrides"
tests = ["crates/harna-core/src/schema/rules.rs"]

[[layers.containers.components]]
name = "decision-log"
kind = "primitive"
path = "crates/harna-core/src/schema/decisions.rs"
summary = "decision records as data: supersedes chains, superseded decisions visibly dead"
tests = ["crates/harna-core/src/schema/decisions.rs"]

[[layers.containers.components]]
name = "handoff"
kind = "primitive"
path = "crates/harna-core/src/schema/handoff.rs"
summary = "the burst journal: recorded before compaction, carried by onboarding/status to the next session"
tests = ["crates/harna-core/src/schema/handoff.rs"]

[[layers.containers.components]]
name = "store"
kind = "primitive"
path = "crates/harna-core/src/schema/store.rs"
summary = ".harna/ handle: TOML persistence, digest, decisions"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "store-registers"
kind = "primitive"
path = "crates/harna-core/src/schema/store/registers.rs"
summary = "the declared registers and ledgers the store persists: templates, deferrals, glossary, non-goals, lessons, roadmap, advisory ledger, archive, scores, decisions"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "store-digest-io"
kind = "primitive"
path = "crates/harna-core/src/schema/store/digest_io.rs"
summary = "the sharded code map on disk: index + shards, streamed reads, atomic writes, orphan cleanup"
tests = ["crates/harna-core/src/schema/store/tests.rs"]

[[layers.containers.components]]
name = "scope"
kind = "primitive"
path = "crates/harna-core/src/schema/scope.rs"
summary = "the one path-scope test: rule scopes, container paths and template scopes match on whole segments, spellings normalized"
tests = ["crates/harna-core/src/schema/scope.rs"]

[[layers.containers.components]]
name = "atomic"
kind = "primitive"
path = "crates/harna-core/src/schema/atomic.rs"
summary = "crash-safe writes for .harna/ data: stage, flush, rename over the live file; append-only records never overwrite"
tests = ["crates/harna-core/src/schema/atomic.rs"]

[[layers.containers.components]]
name = "migrate"
kind = "primitive"
path = "crates/harna-core/src/schema/migrate.rs"
summary = "data schema versioning; backs up, upgrades, logs as decision"
tests = ["crates/harna-core/src/schema/migrate.rs"]

[[layers.containers.components]]
name = "digest-data"
kind = "primitive"
path = "crates/harna-core/src/schema/digest_data.rs"
summary = "the digest's DATA structs owned by memory (the store persists them; search reaches memory, not the reverse)"
tests = ["crates/harna-core/src/schema/digest_data.rs"]

[[layers.containers.components]]
name = "parity-data"
kind = "primitive"
path = "crates/harna-core/src/schema/parity_data.rs"
summary = "the parity TEMPLATES' data structs (0.3.22): declared fan-out shapes for recurring change types, owned by memory like every other persisted document"
tests = ["crates/harna-core/src/schema/parity_data.rs"]

[[layers.containers.components]]
name = "deferred-data"
kind = "primitive"
path = "crates/harna-core/src/schema/deferred_data.rs"
summary = "the DEBT REGISTER's data structs (0.3.23): deliberate deferrals with a review trigger (date or version), overdue reviews cost score debts — distinct from parity debts"
tests = ["crates/harna-core/src/schema/deferred_data.rs"]

[[layers.containers.components]]
name = "terms-data"
kind = "primitive"
path = "crates/harna-core/src/schema/terms_data.rs"
summary = "the GLOSSARY's data structs (0.3.26): agent vocabulary -> harna vocabulary with meanings, alias-collision pure logic; onboarding renders it, doctor audits it, MCP exposes it"
tests = ["crates/harna-core/src/schema/terms_data.rs"]

[[layers.containers.components]]
name = "non-goals-data"
kind = "primitive"
path = "crates/harna-core/src/schema/non_goals_data.rs"
summary = "the DECLINE register's data structs (0.3.27): deliberate product refusals with reasons; plan suppresses proposals whose tokens the refusal covers outright"
tests = ["crates/harna-core/src/schema/non_goals_data.rs"]

[[layers.containers.components]]
name = "lessons-data"
kind = "primitive"
path = "crates/harna-core/src/schema/lessons_data.rs"
summary = "the DEAD-ENDS register's data structs (0.3.27): tried-and-failed records with verdicts and verifiable evidence; place/plan mine them into prior-attempts blocks"
tests = ["crates/harna-core/src/schema/lessons_data.rs"]

[[layers.containers.components]]
name = "roadmap-data"
kind = "primitive"
path = "crates/harna-core/src/schema/roadmap_data.rs"
summary = "the ROADMAP's data structs (0.3.28): declared milestones with states (declared|current|done|dropped); coherence + reached() feeding milestone-keyed deferred reviews; status/onboarding surface the NOW"
tests = ["crates/harna-core/src/schema/roadmap_data.rs"]

[[layers.containers.components]]
name = "acknowledged-data"
kind = "primitive"
path = "crates/harna-core/src/schema/acknowledged_data.rs"
summary = "the ADVISORY LEDGER's data structs (0.3.31): accepted Info findings (check + file) locked away with a reason; errors are never acknowledgeable"
tests = ["crates/harna-core/src/schema/acknowledged_data.rs"]

[[layers]]
name = "search"
role = "engine"
description = "compressed, queryable views of the codebase"
depends_on = ["memory"]

[[layers.containers]]
name = "code-map"
path = "crates/harna-core/src/search"
description = "signatures only, never file bodies"
sequence = ["digest", "digest-resolve", "digest-extract", "diff", "dependents", "whereis", "metrics", "hotspots"]
gateway = "process"

[[layers.containers.components]]
name = "digest"
kind = "primitive"
path = "crates/harna-core/src/search/digest.rs"
summary = "the .harna/digest.json map: signatures + internal deps; agents query it instead of rescanning"
tests = ["crates/harna-core/src/search/digest/tests.rs"]

[[layers.containers.components]]
name = "digest-resolve"
kind = "primitive"
path = "crates/harna-core/src/search/digest/resolve.rs"
summary = "workspace crates and dependency resolution: the single resolver fan-out, layer boundaries and dependents share"
tests = ["crates/harna-core/src/search/digest/tests.rs"]

[[layers.containers.components]]
name = "digest-extract"
kind = "primitive"
path = "crates/harna-core/src/search/digest/extract.rs"
summary = "one Rust file into a map module: internal deps, declared names and mods, body hash; whole test files carry no deps (0.3.37)"
tests = ["crates/harna-core/src/search/digest/tests.rs"]

[[layers.containers.components]]
name = "diff"
kind = "primitive"
path = "crates/harna-core/src/search/diff.rs"
summary = "set-difference between digests; the substrate for parity fan-out"
tests = ["crates/harna-core/src/search/diff.rs"]

[[layers.containers.components]]
name = "dependents"
kind = "primitive"
path = "crates/harna-core/src/search/dependents.rs"
summary = "reverse-edge query on the import graph: who breaks if a module changes (ring 1 + knock-on)"
tests = ["crates/harna-core/src/search/dependents.rs"]

[[layers.containers.components]]
name = "whereis"
kind = "primitive"
path = "crates/harna-core/src/search/whereis.rs"
summary = "symbol-level locator over the digest inventory (pub + private): definitions and referencing modules"
tests = ["crates/harna-core/src/search/whereis.rs"]

[[layers.containers.components]]
name = "metrics"
kind = "primitive"
path = "crates/harna-core/src/search/metrics.rs"
summary = "fan-in/fan-out and boundary pressure over the import graph, plus coupling outliers (shares the one home resolution)"
tests = ["crates/harna-core/src/search/metrics.rs"]

[[layers.containers.components]]
name = "hotspots"
kind = "primitive"
path = "crates/harna-core/src/search/hotspots.rs"
summary = "git churn × digest size: the data-driven accretion advisory (evidence over line counts)"
tests = ["crates/harna-core/src/search/hotspots.rs"]

[[layers]]
name = "integrity"
role = "engine"
description = "the codebase stays conformant to manifest + rules"
depends_on = ["memory", "search", "construction"]

[[layers.containers]]
name = "conformance"
path = "crates/harna-core/src/enforcement"
gateway = "fs:write, process"

[[layers.containers.components]]
name = "validate-urls"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/urls.rs"
summary = "hardcoded URL check (test-code carve-outs, endpoint/constants exemption)"
tests = ["crates/harna-core/src/enforcement/validate/urls.rs"]

[[layers.containers.components]]
name = "validate-boundary"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/boundary.rs"
summary = "cross-layer imports on the real import graph (container-resolved targets)"
tests = ["crates/harna-core/src/enforcement/validate/boundary.rs"]

[[layers.containers.components]]
name = "validate-git"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/git.rs"
summary = "diff-scoped change selection (git status porcelain)"
tests = ["crates/harna-core/src/enforcement/validate/git.rs"]

[[layers.containers.components]]
name = "validate-manifest"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/manifest.rs"
summary = "manifest coherence: paths, sequences, depends_on references"
tests = ["crates/harna-core/src/enforcement/validate/manifest.rs"]

[[layers.containers.components]]
name = "validate-decisions"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/decisions.rs"
summary = "decision-log coherence: supersedes pointers resolve (no ghosts, no cycles)"
tests = ["crates/harna-core/src/enforcement/validate/decisions.rs"]

[[layers.containers.components]]
name = "test-coverage"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/test_coverage.rs"
summary = "registered tests earn their keep: declared paths exist, and changed components took a test update in the burst"
tests = ["crates/harna-core/src/enforcement/validate/test_coverage/tests.rs"]

[[layers.containers.components]]
name = "statuses-data"
kind = "primitive"
path = "crates/harna-core/src/enforcement/statuses.toml"
summary = "parity target statuses as data (constants-are-data)"

[[layers.containers.components]]
name = "statuses-loader"
kind = "primitive"
path = "crates/harna-core/src/enforcement/statuses.rs"
summary = "the single loader consuming statuses.toml"
tests = ["crates/harna-core/src/enforcement/statuses.rs"]

[[layers.containers.components]]
name = "checks-data"
kind = "primitive"
path = "crates/harna-core/src/enforcement/checks.toml"
summary = "check registry as data: rule-bindable check ids, descriptions, default severities"

[[layers.containers.components]]
name = "check-registry"
kind = "primitive"
path = "crates/harna-core/src/enforcement/checks.rs"
summary = "the single loader consuming checks.toml: bindings, severity overrides and doctor read one canonical source"
tests = ["crates/harna-core/src/enforcement/checks.rs"]

[[layers.containers.components]]
name = "violation-shape"
kind = "primitive"
path = "crates/harna-core/src/enforcement/violation.rs"
summary = "the shared violation shape (Severity + token-efficient render), outside validate so registry and checker cannot ring each other"
tests = ["crates/harna-core/src/enforcement/violation.rs"]

[[layers.containers.components]]
name = "rule-bindings"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/rule_bindings.rs"
summary = "coherence between rules.toml and the check registry: unknown bindings warn, known ones annotate violations and may override their check's severity, env-scoped and pattern-bound"
tests = ["crates/harna-core/src/enforcement/validate/rule_bindings.rs"]

[[layers.containers.components]]
name = "pattern-rules"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/pattern.rs"
summary = "naming conventions as lint-as-data: a rule's regex over paths and declared names, env-scoped, severity-overrideable"
tests = ["crates/harna-core/src/enforcement/validate/pattern.rs"]

[[layers.containers.components]]
name = "structure"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/structure.rs"
summary = "structural invariants on the committed map: the import graph stays acyclic (rings named), engine containers keep their variants at home"
tests = ["crates/harna-core/src/enforcement/validate/structure.rs"]

[[layers.containers.components]]
name = "budgets"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/budgets.rs"
summary = "size budgets as rule data: container-size (components per container) and fan-out-cap (imports per component) limits live in rules.toml `limit`"
tests = ["crates/harna-core/src/enforcement/validate/budgets.rs"]

[[layers.containers.components]]
name = "reuse"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/reuse.rs"
summary = "duplication made visible: near-duplicate blocks named across files (no-copy-paste), one symbol one home (single-owner)"
tests = ["crates/harna-core/src/enforcement/validate/reuse.rs"]

[[layers.containers.components]]
name = "layering"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/layering.rs"
summary = "strict layering over the depends_on DAG: ranks from the graph, no-bypass (one rank per import), depth-budget as rule data"
tests = ["crates/harna-core/src/enforcement/validate/layering.rs"]

[[layers.containers.components]]
name = "validate-gateway"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/gateway.rs"
summary = "boundary facilities owned by declaring containers: fs (reads open, writes the monopoly via :write), net, process, base (rank-0 reach)"
tests = ["crates/harna-core/src/enforcement/validate/gateway/tests.rs"]

[[layers.containers.components]]
name = "validate-transit"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/transit.rs"
summary = "corridor discipline: connects declarations (no-sideways) and thin transiter budgets (transiter-thinness)"
tests = ["crates/harna-core/src/enforcement/validate/transit.rs"]

[[layers.containers.components]]
name = "validate-roles"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/roles.rs"
summary = "role-keyed checks (0.3.25 layers as data): role-async (async fns inventoried by the map appear only in orchestration-async/interface roles) and rules-coverage (no live rule watches an advisory island)"
tests = ["crates/harna-core/src/enforcement/validate/roles.rs"]

[[layers.containers.components]]
name = "validate-hotspot"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/hotspot.rs"
summary = "the hotspot check: modules past the churn × items threshold are accretion candidates with evidence"
tests = ["crates/harna-core/src/enforcement/validate/hotspot.rs"]

[[layers.containers.components]]
name = "deny-sync"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/deny_sync.rs"
summary = "deny.toml agrees with the manifest: staleness reported instead of silently enforced old graphs"
tests = ["crates/harna-core/src/enforcement/validate/deny_sync.rs"]

[[layers.containers.components]]
name = "parity"
kind = "primitive"
path = "crates/harna-core/src/enforcement/parity.rs"
summary = "change-propagation ledger: fan-out from digest diff, ack/noop/auto resolution, generations"
tests = ["crates/harna-core/src/enforcement/parity/tests.rs"]

[[layers.containers.components]]
name = "parity-auto"
kind = "primitive"
path = "crates/harna-core/src/enforcement/parity/auto.rs"
summary = "the auto-verification pass (never waives a breaking importer)"
tests = ["crates/harna-core/src/enforcement/parity/tests.rs"]

[[layers.containers.components]]
name = "parity-resolve"
kind = "primitive"
path = "crates/harna-core/src/enforcement/parity/resolve.rs"
summary = "resolving targets one at a time or in bulk; the previous verdict surfaced before it is overwritten"
tests = ["crates/harna-core/src/enforcement/parity/tests.rs"]

[[layers.containers.components]]
name = "parity-views"
kind = "primitive"
path = "crates/harna-core/src/enforcement/parity/views.rs"
summary = "reading the ledger: rendered views, open-debt count, stamp rate, the declared-shape orientation"
tests = ["crates/harna-core/src/enforcement/parity/tests.rs"]

[[layers.containers.components]]
name = "parity-policy"
kind = "primitive"
path = "crates/harna-core/src/enforcement/parity_policy.rs"
summary = "who needs a human: origins and additive importers resolve themselves, importers of breaking changes stay owed; rubber-stamp rate"
tests = ["crates/harna-core/src/enforcement/parity_policy.rs", "crates/harna-mcp/tests/scenarios.rs"]

[[layers.containers.components]]
name = "roadmap-coherence"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/roadmap.rs"
summary = "validate check (0.3.28): the declared roadmap stays sound data (unique ids, known states, one current) and deferred reviews keyed to milestones point at something declared; a done milestone's open keyed reviews surface as due"
tests = ["crates/harna-core/src/enforcement/validate/roadmap.rs"]

[[layers.containers.components]]
name = "rename-linkage"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/rename.rs"
summary = "validate check (0.3.31): a declared manifest path missing on disk with the same file name alive elsewhere is a stale linkage — propose the move, never rewrite it"
tests = ["crates/harna-core/src/enforcement/validate/rename.rs"]

[[layers.containers.components]]
name = "acknowledge"
kind = "primitive"
path = "crates/harna-core/src/enforcement/validate/acknowledge.rs"
summary = "the advisory ledger's enforcement half (0.3.31): pure partition of Info findings into live vs locked; errors are never lockable"
tests = ["crates/harna-core/src/enforcement/validate/acknowledge.rs"]

[[layers]]
name = "construction"
role = "engine"
description = "structure is born correct through templates"
depends_on = ["memory", "search"]

[[layers.containers]]
name = "structure"
path = "crates/harna-core/src/generation"
description = "scaffolding keeps structure born correct; deny compiles the layering; render emits the human views; graph exports the dependency graph; adopt drafts a manifest proposal from the existing tree"
sequence = ["scaffold", "linkage", "deny", "render", "graph", "adopt", "hooks"]
gateway = "fs:write"

[[layers.containers.components]]
name = "scaffold"
kind = "primitive"
path = "crates/harna-core/src/generation/scaffold.rs"
summary = "primitive/compound generation + manifest registration in one step"
tests = ["crates/harna-core/src/generation/scaffold/tests.rs"]

[[layers.containers.components]]
name = "deny"
kind = "primitive"
path = "crates/harna-core/src/generation/deny.rs"
summary = "renders layer topology into deny.toml; cargo-deny turns layering into build errors"
tests = ["crates/harna-core/src/generation/deny.rs"]

[[layers.containers.components]]
name = "render"
kind = "primitive"
path = "crates/harna-core/src/generation/render.rs"
summary = "emits human views (ARCHITECTURE.md) from the manifest - generated, committed, diffable"
tests = ["crates/harna-core/src/generation/render.rs"]

[[layers.containers.components]]
name = "graph"
kind = "primitive"
path = "crates/harna-core/src/generation/graph.rs"
summary = "exports the dependency graph (DOT, Mermaid): map modules as nodes, resolved internal imports as edges, the manifest's layer/container topology as clusters in manifest order"
tests = ["crates/harna-core/src/generation/graph.rs"]

[[layers.containers.components]]
name = "adopt"
kind = "primitive"
path = "crates/harna-core/src/generation/adopt.rs"
summary = "drafts a manifest proposal from the existing tree - one layer per crate (package names), depends_on from the shared cross-crate resolution, one component per module with its size - printed to stdout, pruned by the adopter, never written"
tests = ["crates/harna-core/src/generation/adopt.rs"]

[[layers.containers.components]]
name = "hooks"
kind = "primitive"
path = "crates/harna-core/src/generation/hooks.rs"
summary = "the enforcement harna installs for itself: fail-closed git pre-commit, merged Claude Code hooks, CI workflow; harna-managed marker, never overwrites user files"
tests = ["crates/harna-core/src/generation/hooks.rs"]

[[layers.containers.components]]
name = "linkage"
kind = "primitive"
path = "crates/harna-core/src/generation/linkage.rs"
summary = "a new file is linked the moment it exists: wires the parent mod chain to the crate root, fills empty tests fields with the tests that exist"
tests = ["crates/harna-core/src/generation/linkage/tests.rs"]

[[layers]]
name = "interface"
role = "interface"
description = "the two entry points: humans (CLI) and agents (MCP)"
depends_on = ["memory", "search", "integrity", "construction", "agent-context"]

[[layers.containers]]
name = "cli"
path = "crates/harna-cli/src"
description = "human workflow: dispatch enum and one-liner arms (subcommand engines live in cli-commands)"

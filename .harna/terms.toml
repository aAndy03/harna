schema_version = 1

[[terms]]
word = "layer"
aliases = [
    "stratum",
    "tier",
]
means = "the top partition; layers with depends_on form the DAG — imports only reach layers a layer declares"

[[terms]]
word = "container"
aliases = [
    "module-group",
    "crate-area",
    "folder",
]
means = "a layer's membership unit: a source directory hosting components; the place where a role is stamped"

[[terms]]
word = "component"
aliases = [
    "module",
    "unit",
    "file",
]
means = "one registered item in a container (a primitive leaf or a compound folder) with a declared path and tests"

[[terms]]
word = "engine"
aliases = [
    "domain",
    "subsystem",
    "brain",
]
means = "the role of a container that owns a concern end-to-end; engines never import each other sideways — connectivity is a transiter's job"

[[terms]]
word = "gateway"
aliases = [
    "facility monopoly",
    "side-effect owner",
    "fs:write",
]
means = "a declared facility (fs | net | process | base) a container owns; anything touching it outside the declaring container is a violation"

[[terms]]
word = "transiter"
aliases = [
    "bridge",
    "corridor",
    "connector",
    "shim",
]
means = "a thin container declared `connects = [from, to]` that carries cross-layer traffic; thinness is bounded by rule data"

[[terms]]
word = "parity"
aliases = [
    "ripple",
    "fallout",
    "blast radius",
    "impact analysis",
    "change propagation",
]
means = "the ledger of change propagation: digest diff -> fan-out targets -> ack/noop/auto resolution; open debts gate validation"

[[terms]]
word = "digest"
aliases = [
    "code map",
    "the map",
    "map",
]
means = "the compressed queryable map in .harna/digest/ (signatures, inventory, deps) — agents query it instead of rescanning"

[[terms]]
word = "rule"
aliases = [
    "convention",
    "lint",
    "policy",
]
means = "scoped instruction with rationale and origin, persisted in rules.toml; may bind a check id and override its severity"

[[terms]]
word = "decision"
aliases = [
    "ADR",
    "design decision",
    "choice",
]
means = "a recorded RDR-style record under .harna/decisions/ with supersedes chains; superseded decisions stay visibly dead"

[[terms]]
word = "deferred"
aliases = [
    "debt register",
    "postponed work",
    "not now",
]
means = "a deliberate deferral in .harna/deferred.toml with a review trigger (date or version); overdue reviews cost a score debt"

[[terms]]
word = "handoff"
aliases = [
    "burst journal",
    "continuation",
    "resume point",
]
means = "the burst journal recorded before compaction; onboarding and status carry it to the next session"

[[terms]]
word = "born"
aliases = [
    "born-size",
    "born modular",
    "birth",
]
means = "a file's arrival with structure already correct: per-scope, within its budget from the first line — no retro-splitting"

[[terms]]
word = "scaffold"
aliases = [
    "generate",
    "init component",
    "bootstrap",
]
means = "generate a component and register it in the manifest in one step; structure is born correct, imports point outward"

[[terms]]
word = "service"
aliases = [
    "microservice",
    "deployable",
    "worker",
]
means = "a unit that runs and deploys on its own (an API, a worker): .harna/services.toml names the containers only it runs and the resources only it writes; code no service names is shared"

[[terms]]
word = "service-corridor"
aliases = [
    "channel",
    "message bus",
    "topic",
]
means = "a declared channel between services (queue, event bus, API) with its message shapes, in services.toml — not a transiter, which is the in-process hand-off between layers"

[[terms]]
word = "facet"
aliases = [
    "readiness item",
    "ops checklist",
]
means = "a readiness question every service answers before a release (health, backups, migrations): harna service require / ready; preflight holds the release until answered"

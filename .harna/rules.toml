schema_version = 1

[[rules]]
id = "no-hardcoded-urls"
text = "No http(s):// literals outside endpoint/constants modules"
rationale = "URLs must be swappable per environment; hardcoded ones broke staging deploys in past projects"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-14"

[[rules]]
id = "engines-via-transiters"
text = "Engines never call each other directly; route through transiters"
rationale = "Direct coupling made the billing engine unreusable in earlier projects Deprecated: harna declares no corridors: the rule described a structure the repo does not have; superseded by engines-import-declared-layers (0.3.50)"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-14"
check = "layer-boundary"
status = "deprecated"

[[rules]]
id = "born-modular"
text = "Code modularly from the start: every file is written per-scope and within its container's component budget at birth; never write an oversized file intending to split it later"
rationale = "Retro-splitting wastes agent context and review time. Structure is born correct (harna's own generation-layer principle): 0.3.26 adds the born-size check so a new file over the bound rule's limit is a validation error, not a leftover debt; existing files stay covered by the advisory hotspot/component-granularity checks"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-17"
check = "born-size"
limit = 600

[[rules]]
id = "folder-budget"
text = "A folder holds at most 8 source files; group related files into sub-folders"
rationale = "Flat folders made agents encode grouping in file names (8 *_data.rs files in schema/); the tree is the structure (0.3.39)"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-18"
check = "folder-size"
severity = "error"
limit = 8

[[rules]]
id = "no-name-clusters"
text = "Files sharing a name token (3+) live in a folder named after it, not side by side"
rationale = "*_data.rs, cmd_*.rs, hook_*.rs are folders that were never created; harna move makes the fix one command"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-18"
check = "name-cluster"
severity = "error"

[[rules]]
id = "flow-and-maintenance"
text = "Every release also optimizes harna's own usage flow (fewer steps, fewer calls, clearer output) and keeps everything maintained: each change goes through parity, and features that ship stay coherent with the rest"
rationale = "The user's standing principle (2026-10-19): harna is used daily by agents, so friction compounds across versions; parity exists so nothing silently rots as features accumulate"
origin = "user via harna CLI, 2026-10-19"

[[rules]]
id = "suppression-reason"
text = 'Every #[allow] says why (reason = "…")'
rationale = "An exemption without a reason cannot be reviewed; deno study B2 — adopted on harna itself"
origin = "user via harna CLI, 2026-10-19"
check = "suppression-reason"

[[rules]]
id = "tools-not-prescriptions"
text = "harna ships tools (checks, profiles, plugins, catalogs) as data the agent or engineer chooses to use; it never hardcodes a product decision (auth, licensing, offline vs online, a framework's API) into harna's code"
rationale = "The user's standing principle (2026-10-20): harna is like Figma — it shows tools, it does not dictate the design. Domain and framework knowledge (gpui-kit 0.8.0, TypeScript) lives in versioned data packs/plugins that track their upstream API, so harna's core stays general"
origin = "user via harna CLI, 2026-10-20"

[[rules]]
id = "engines-import-declared-layers"
text = "Each layer imports only itself and the layers it declares in depends_on; a hand-off several layers share goes through one declared corridor (transiter) instead of direct edges"
rationale = "Direct coupling made the billing engine unreusable in earlier projects; depends_on is what harna enforces today, corridors are the tool for a shared hand-off when one appears"
scope = ["crates"]
origin = "user via harna CLI, 2026-10-20"
check = "layer-boundary"

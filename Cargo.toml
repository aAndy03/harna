[workspace]
resolver = "2"
members = [
    "crates/harna-core",
    "crates/harna-cli",
    "crates/harna-mcp",
]

[workspace.package]
version = "0.2.12"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = "0.4"

[profile.release]
lto = true
strip = true

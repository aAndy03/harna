[workspace]
resolver = "2"
members = [
    "crates/harna-core",
    "crates/harna-cli",
    "crates/harna-mcp",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/aAndy03/harna"
homepage = "https://github.com/aAndy03/harna"
documentation = "https://github.com/aAndy03/harna/tree/main/docs"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
chrono = "0.4"
regex = "1"

[profile.release]
lto = true
strip = true

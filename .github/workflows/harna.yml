# harna-managed: ci v1+craft — written by `harna hooks install --target ci`.
name: harna
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install harna (the version that wrote this workflow)
        run: |
          if [ -f crates/harna-cli/Cargo.toml ]; then
            cargo install --path crates/harna-cli --locked
          else
            cargo install harna-cli --locked --version 0.3.40
          fi
      - name: Conformance (every file, every gate)
        run: harna validate
      - name: Release gate
        run: harna preflight
  craft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

# harna-managed: ci v1+craft — written by `harna hooks install --target ci`.
# The local pre-commit gate already runs these checks on every commit, so
# CI runs only where that gate cannot reach: pull requests (code from
# clones without the hooks), release tags (one clean-machine check per
# release), and on demand — never again on every push.
name: harna
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install harna (the version that wrote this workflow)
        run: |
          if [ -f crates/harna-cli/Cargo.toml ]; then
            cargo install --path crates/harna-cli --locked
          else
            cargo install harna-cli --locked --version 1.1.7
          fi
      - name: Conformance (every file, every gate)
        # a pull request is judged on its whole range: the diff-reading
        # checks (append-only, test-weakened) compare against the base
        env:
          HARNA_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: harna validate
      - name: Release gate
        run: harna preflight
  craft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

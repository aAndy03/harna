[package]
name = "harna-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "../../README.md"
description = "MCP stdio server for harna: the tools an agent calls instead of re-learning."
keywords = ["agent-context", "mcp", "onboarding"]
categories = ["development-tools"]

[dependencies]
harna-core = { path = "../harna-core", version = "0.6.0" }
rmcp = { version = "0.3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["full"] }
chrono.workspace = true

anyhow.workspace = true

# harna's toolbox as data (0.3.50): what each tool is for, when to reach
# for it, and how. Like a design tool's palette: every tool is visible,
# none is required — the agent or engineer chooses. `signal` names a
# structural condition `place`/`plan` can detect in the containers they
# focus on; when it holds, the tool is offered there, in context.
# Signals are generic (structure, never a framework or product name).

[[tools]]
id = "gateway"
title = "Gateway: one owner for a facility"
does = "makes one container the only place that touches disk, network or processes (fs | fs:write | net | process)"
reach_for = "code that talks to the outside world; keep the rest of the system pure and testable"
how = "harna container set <container> --gateway fs:write"
enforces = "gateway-ownership"

[[tools]]
id = "crate-gateway"
title = "Crate gateway: one owner for an external crate"
does = "only the owner's crate may depend on the crate in Cargo.toml, only its modules may name it"
reach_for = "a database driver, HTTP client or UI toolkit that should stay behind one boundary"
how = "harna container set <container> --gateway crate:<name>"
enforces = "gateway-ownership"
signal = "external-crate-single-user"

[[tools]]
id = "layers"
title = "Layers and depends_on: who may import whom"
does = "each layer imports only itself and the layers it declares; Cargo dependencies are held to the same graph"
reach_for = "any boundary that must hold as the code grows (rules may not reach storage, UI may not reach the database)"
how = "harna layer set <layer> --depends-on a,b"
enforces = "layer-boundary"

[[tools]]
id = "surface"
title = "Declared surface: what a container offers"
does = "a container lists the names other containers may import; everything else stays private and free to change"
reach_for = "a container others depend on — a domain kernel, a repository layer — whose internals must stay changeable"
how = "harna container surface <container> (a draft from its pub use / public items; --apply accepts it) | harna container set <container> --provides Money,Account"
enforces = "declared-surface"
signal = "imported-without-surface"

[[tools]]
id = "corridor"
title = "Corridor: one named, thin hand-off between layers"
does = "a transiter container connects two layers; the hand-off lives in one place instead of being spread through both"
reach_for = "a container many other layers import directly — a command bus, an event channel, an API facade"
how = "harna transiter --from <layer> --to <layer>"
enforces = "transiter-thinness"
signal = "imported-across-layers"

[[tools]]
id = "rule"
title = "Rule: a convention as data"
does = "records what to do and why for a scope; shown to every session working there; optionally bound to a check"
reach_for = "the moment a convention is agreed (money is never a float, errors never leak storage details)"
how = "harna add-rule --id <id> --text ... --rationale ... --scope <path> [--check <id>] [--scope-signature '\bMoney\b'] (by meaning: every file declaring a match)"
signal = "no-rules-in-scope"

[[tools]]
id = "banned-api"
title = "Banned API with its replacement"
does = "a path may not appear in scope; `path => replacement` says where to go; harna deny writes it into clippy.toml"
reach_for = "a call that must go through your own abstraction (wall clock, raw filesystem, floats for money)"
how = "harna add-rule ... --check banned-api --value 'std::time::SystemTime::now => Clock::now'"
enforces = "banned-api"

[[tools]]
id = "crate-conformity"
title = "Crate conformity"
does = "every crate in scope carries required files (file:NAME) and Cargo keys (toml:KEY = VALUE)"
reach_for = "workspace-wide conventions: inherited lints, a companion BUILD file, a license header file"
how = "harna add-rule ... --check crate-conformity --value 'toml:lints.workspace = true'"
enforces = "crate-conformity"

[[tools]]
id = "tests-registry"
title = "Registered tests"
does = "ties components to the tests that cover them; `harna tests --component X` prints the exact command"
reach_for = "integration tests that cover many components; a change without its test update is named"
how = "harna container tests <container> --add <tests/file.rs>"
enforces = "no-test-update"
signal = "untested-components"

[[tools]]
id = "slots"
title = "Planned slots: a home for the future"
does = "declares a component before its code (the cache will live here, behind this gateway); validate reads it as intent; place points matching work at it; scaffold with its name fills it"
reach_for = "the parts a quality says you will need (cache, job queue, audit log, sync) but do not build yet"
how = "harna slot add <container> warm-cache --path crates/app/src/cache/warm.rs --summary 'read-through cache behind the storage gateway'"

[[tools]]
id = "test-kinds"
title = "Test kinds: what each kind of test may cross"
does = "declares where a kind of test lives (path globs) and which layers it may reach; its files and the crates' dev-dependencies are held to that"
reach_for = "integration or end-to-end tests that cross layers on purpose — make the crossing a declared choice"
how = "harna test-kind add integration --path 'crates/*/tests/**' --reach store; require one: harna add-rule --check kind-coverage --value ui --scope crates/features"
enforces = "test-reach"

[[tools]]
id = "scaffold"
title = "Scaffold: structure first"
does = "creates components (several per call) registered in the manifest and wired into the module tree"
reach_for = "before writing code: the files are born where they belong"
how = "harna scaffold --layer <l> --container <c> --name a --name b --kind primitive [--empty] [--new-crate lib|bin]"

[[tools]]
id = "move"
title = "Move without breaking links"
does = "relocates a file or folder and relinks manifest, rule scopes, mod declarations and use paths"
reach_for = "restructuring; never move Rust files by hand"
how = "harna move <from> <to>"

[[tools]]
id = "parity"
title = "Parity: changes reach their importers"
does = "turns a structural diff into the list of modules that must be reviewed; open debts gate validation"
reach_for = "after any change to a public signature, trait or module"
how = "harna scan; harna parity open <id>; harna parity resolve ..."

[[tools]]
id = "ledgers"
title = "Acknowledge, baseline, defer: bending a rule on the record"
does = "an exception with a reason, a count that may only fall, or a review keyed to a date or milestone"
reach_for = "a violation that is intentional or too large to fix now — never silence it"
how = "harna acknowledge ... | harna baseline ... | harna deferred add ..."

[[tools]]
id = "qualities"
title = "Qualities: what the software must hold over its life"
does = "records long-term intent (scale, latency, offline, data-loss tolerance, privacy) with its measure and scope; onboarding, plan and place show it to every session"
reach_for = "before designing anything that must survive growth: say how many users, how fast, how safe, offline or online"
how = "harna quality add scale-users --statement 'serves many households' --measure '1M users' --category scale [--held-by <rule-id>]"
signal = "no-qualities-declared"

[[tools]]
id = "decision"
title = "Decision log"
does = "records a non-obvious choice with its context; superseding keeps the chain"
reach_for = "any choice a future session would otherwise re-litigate"
how = "harna log-decision --title ... --body ..."

[[tools]]
id = "declines"
title = "Non-goals and lessons"
does = "deliberate refusals and tried-and-failed directions; plan/place surface them before anyone re-proposes"
reach_for = "the user says no to something, or an approach failed with evidence"
how = "harna non-goal add ... | harna lesson add ..."

[[tools]]
id = "generated-proof"
title = "Generated outputs and their proof"
does = "declares generated files and the command that proves them current; harna's CI workflow runs it"
reach_for = "anything produced by a generator (schemas, bindings, workflows)"
how = "harna add-rule ... --check generated --scope <outputs> --value <sources> --command '<gen> --check'"
enforces = "generated"

[[tools]]
id = "roadmap"
title = "Roadmap and handoff"
does = "declared milestones (where the project is going) and the burst journal (where this session stopped)"
reach_for = "planning what is next; before a session ends or compacts"
how = "harna roadmap add|set ... | harna handoff --summary ... --next ..."

[[tools]]
id = "plugins"
title = "Plugins: a framework's conventions as a versioned pack"
does = "vendors a framework's rules and vocabulary (gpui-kit 0.8.0, ...) into .harna/plugins/<name>/; they apply beside your rules as <plugin>/<id>, and the doctor warns when Cargo.lock outruns the version the plugin mirrors"
reach_for = "building on a framework whose conventions should hold in every session, kept in step with its release"
how = "harna plugin list; harna plugin add gpui-kit; harna plugin show gpui-kit"

[[tools]]
id = "profiles"
title = "Profiles: a starting shape for a kind of project"
does = "writes a manifest, rules, qualities and vocabulary to prune, and installs the plugins the shape builds on"
reach_for = "a new project of a known kind (a gpui-kit desktop app), before the first crate exists"
how = "harna profile list; harna init --profile rust-gpui-desktop"

[[tools]]
id = "code-pattern"
title = "Code pattern: a convention over code lines, as data"
does = "a rule's regex over live code (comments and tests masked); within:<regex> limits it to the block a line opens (inside fn render), unless:<regex> excuses a statement (.detach())"
reach_for = "a convention a type system cannot hold: state created in render, a dropped handle, an index used as identity"
how = "harna add-rule --id r --text ... --rationale ... --check code-pattern --pattern 'cx\\.new\\(' --value 'within:fn render\\('"
enforces = "code-pattern"

[[tools]]
id = "registry"
title = "Registry: declared names used, bindings unique"
does = "declare:<regex> names (group 1) must be used elsewhere (use:<regex> with NAME); bind:<regex> keys (group 1, scope group 2) must not repeat in one scope — full validate"
reach_for = "actions, commands, routes, key bindings: anything declared in one place and handled in another"
how = "harna add-rule --check registry --value 'declare:actions!\\([^,]+,\\s*\\[([^\\]]*)\\]' ..."
enforces = "registry"

[[tools]]
id = "capabilities"
title = "Capabilities: a plugin's tokens one container owns"
does = "a plugin names token sets ([capabilities]); a container owns one (gpui-kit:menus, gpui-kit:raw-input) and every other container calling those is an ownership error"
reach_for = "one engine for menus, raw input, a bridge: the framework names stay in the plugin, the boundary in your manifest"
how = "harna plugin show gpui-kit; harna container set <engine> --owns gpui-kit:menus"
enforces = "ownership"

[[tools]]
id = "api-parity"
title = "API parity: a framework's surface as data"
does = "a plugin's api.toml (generated from the release source: harna plugin api) lets every path into the crate resolve; an invented module or item is named with the version"
reach_for = "agents writing against a fast-moving framework API they half remember"
how = "harna plugin add gpui-kit (ships api.toml); bind a rule: --check api-parity"
enforces = "api-parity"

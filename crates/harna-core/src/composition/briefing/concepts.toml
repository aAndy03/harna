schema_version = 1

# harna's built-in concept map (0.3.34): the vocabulary every agent needs,
# defined once. Onboarding shows it when a repo has recorded no glossary
# of its own (.harna/terms.toml wins when present); tool descriptions
# stay short because the meanings live here. Data, not code: one loader
# (onboarding::concepts) consumes it.

[[terms]]
word = "layer"
aliases = ["stratum", "tier"]
means = "the top partition; layers with depends_on form the DAG — imports only reach layers a layer declares"

[[terms]]
word = "container"
aliases = ["module-group", "crate-area", "folder"]
means = "a layer's membership unit: a source directory hosting components; the place where a role is stamped"

[[terms]]
word = "component"
aliases = ["module", "unit", "file"]
means = "one registered item in a container (a primitive leaf or a compound folder) with a declared path and tests"

[[terms]]
word = "engine"
aliases = ["service", "domain", "subsystem", "brain"]
means = "the role of a container that owns a concern end-to-end; engines never import each other sideways — connectivity is a transiter's job"

[[terms]]
word = "gateway"
aliases = ["facility monopoly", "side-effect owner", "fs:write"]
means = "a declared facility (fs | net | process | base) a container owns; anything touching it outside the declaring container is a violation"

[[terms]]
word = "transiter"
aliases = ["corridor", "bridge", "connector", "command bus", "event channel", "shim"]
means = "a corridor: the thin container (`connects = [a, b]`) two layers hand off through — command bus, event channel, API facade"

[[terms]]
word = "parity"
aliases = ["ripple", "fallout", "blast radius", "impact analysis", "change propagation"]
means = "the ledger of change propagation: digest diff -> fan-out targets -> ack/noop/auto resolution; open debts gate validation"

[[terms]]
word = "digest"
aliases = ["code map", "the map", "map"]
means = "the compressed queryable map in .harna/digest/ (signatures, inventory, deps) — agents query it instead of rescanning"

[[terms]]
word = "rule"
aliases = ["convention", "lint", "policy"]
means = "scoped instruction with rationale and origin, persisted in rules.toml; may bind a check id and override its severity"

[[terms]]
word = "decision"
aliases = ["ADR", "design decision", "choice"]
means = "a recorded RDR-style record under .harna/decisions/ with supersedes chains; superseded decisions stay visibly dead"

[[terms]]
word = "deferred"
aliases = ["debt register", "postponed work", "not now"]
means = "a deliberate deferral in .harna/deferred.toml with a review trigger (date or version); overdue reviews cost a score debt"

[[terms]]
word = "handoff"
aliases = ["burst journal", "continuation", "resume point"]
means = "the burst journal recorded before compaction; onboarding and status carry it to the next session"

[[terms]]
word = "born"
aliases = ["born-size", "born modular", "birth"]
means = "a file's arrival with structure already correct: per-scope, within its budget from the first line — no retro-splitting"

[[terms]]
word = "scaffold"
aliases = ["generate", "init component", "bootstrap"]
means = "generate a component and register it in the manifest in one step; structure is born correct, imports point outward"

[[terms]]
word = "non-goal"
aliases = ["refusal", "won't do", "out of scope"]
means = "a deliberate product refusal with a reason (.harna/non-goals.toml); plan/place suppress proposals it fully covers"

[[terms]]
word = "lesson"
aliases = ["dead end", "tried and failed", "post-mortem"]
means = "a tried-and-failed direction with its verdict and evidence (.harna/lessons.toml); plan/place surface it before it is re-suggested"

[[terms]]
word = "roadmap"
aliases = ["milestones", "plan", "release plan"]
means = "declared milestones (declared|current|done|dropped) in .harna/roadmap.toml — never generated; NOW is the current one"

[[terms]]
word = "acknowledged"
aliases = ["advisory ledger", "accepted warning", "suppression"]
means = "an Info finding accepted with a reason (.harna/acknowledged.toml): it renders as a receipt and never blocks; errors cannot be acknowledged"

[[terms]]
word = "preflight"
aliases = ["release gate", "ship check"]
means = "the release gate: validation + doctor + open parity + map freshness as one PASS/FAIL; the test suite runs outside it"

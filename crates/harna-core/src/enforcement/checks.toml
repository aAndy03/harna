# `check-registry` — data source (single point of truth; constants-are-data).
# Every rule-bindable check id a validator can enforce: what it enforces and
# its default severity (`error` gates by default, `info` advises). A bound
# rule may override the severity per check (rules.toml `severity = ...`).
# Keep code reading this file through `checks.rs`; when the set diverges,
# split into further data files and let loaders compose them.

[[checks]]
id = "no-hardcoded-urls"
description = "no hardcoded http(s) URLs in source; route through endpoint/constants modules (advisory until a rule binds it)"
severity = "error"
adopted_by_binding = true

[[checks]]
id = "layer-boundary"
description = "imports stay inside the importer's own layers plus declared depends_on"
severity = "error"

[[checks]]
id = "manifest-path"
description = "component paths declared in the manifest resolve on disk"
severity = "error"

[[checks]]
id = "manifest-sequence"
description = "sequence lists name declared components, once each (unlisted order is advisory)"
severity = "info"

[[checks]]
id = "manifest-depends"
description = "layer depends_on names exist (coherence of the manifest graph)"
severity = "error"

[[checks]]
id = "parity-open"
description = "structural changes left unresolved parity targets to acknowledge, record or verify"
severity = "error"

[[checks]]
id = "roadmap"
description = "the declared roadmap stays sound data (unique ids, known states, one current) and deferred reviews keyed to milestones point at something declared"
severity = "error"

[[checks]]
id = "rename-linkage"
description = "a declared manifest path missing on disk with the same file name alive elsewhere is a stale linkage — update the manifest, the move may be deliberate"
severity = "error"

[[checks]]
id = "fanout-shape"
description = "an open parity event's fan-out exceeds a parity template's declared ceiling for its scope (Info: the declared shape was walked past; a bound rule may promote)"
severity = "info"

[[checks]]
id = "component-granularity"
description = "guidance: an accreting component file is a candidate to become its own container; advisory past 600 lines or the bound rule's `limit`"
severity = "info"
takes_limit = true

[[checks]]
id = "tests-declared"
description = "registered test paths exist and hold real test code"
severity = "error"

[[checks]]
id = "no-test-update"
description = "a changed component whose registered tests were untouched in the burst (advisory)"
severity = "info"

[[checks]]
id = "decision-chain"
description = "supersedes pointers in the decision log resolve (no ghosts, no self-references, no cycles)"
severity = "error"

[[checks]]
id = "pattern"
description = "a rule's regex over file paths and declared names (naming conventions as lint-as-data; the rule supplies regex + severity)"
severity = "info"

[[checks]]
id = "declared-surface"
description = "cross-container imports consume only the target container's declared `provides`; private symbols never cross containers"
severity = "error"

[[checks]]
id = "no-cycles"
description = "the import graph stays acyclic; a cycle is reported as the ring it forms"
severity = "error"

[[checks]]
id = "engine-own-container"
description = "a container declared role = engine keeps its variants/extensions inside its own container path"
severity = "error"

[[checks]]
id = "container-size"
description = "a container stays bounded in components; the budget is the `limit` on the bound rule"
severity = "info"
takes_limit = true

[[checks]]
id = "fan-out-cap"
description = "a component stays bounded in outgoing imports; the budget is the `limit` on the bound rule"
severity = "info"
takes_limit = true

[[checks]]
id = "no-copy-paste"
description = "near-duplicate code blocks across files are named; consistency beats copies"
severity = "info"

[[checks]]
id = "single-owner"
description = "one symbol, one home: a declared name in several modules is a colliding home to resolve"
severity = "info"

[[checks]]
id = "no-bypass"
description = "an import reaches at most one rank down the layer DAG (skipping ranks bypasses the intermediate layer's data rules)"
severity = "error"

[[checks]]
id = "depth-budget"
description = "how far an import reaches down the rank ladder; the budget is the `limit` on the bound rule"
severity = "info"
takes_limit = true

[[checks]]
id = "gateway-ownership"
description = "a facility (fs | net | process | base) is touched only inside containers that declare it with `gateway` (a `:write` suffix means the write side only); `crate:NAME` owns an external crate (only the owner's crate depends on it, only its modules name it); declaring one engages the check"
severity = "error"

[[checks]]
id = "no-sideways"
description = "when a container declares `connects = [from, to]`, cross-layer imports between the connected layers travel through that corridor (transiter), not in a direct edge"
severity = "error"

[[checks]]
id = "transiter-thinness"
description = "a declared corridor (transiter: a container with `connects`) stays thin: declared items + signatures per module under the bound rule's `limit`"
severity = "info"
takes_limit = true

[[checks]]
id = "hotspot"
description = "a module past the churn × items threshold (statistical, or the bound rule's `limit` as a fixed score) keeps changing while carrying weight — an accretion candidate with evidence"
severity = "info"
takes_limit = true

[[checks]]
id = "role-async"
description = "async fns (inventoried as async-fn by the map) appear only in the orchestration-async and interface roles; engines, bases, gateways, transiters and sync orchestration stay sync"
severity = "error"

[[checks]]
id = "rules-coverage"
description = "every declared container is watched by at least one scoped, live rule (an unwatched container is an advisory island)"
severity = "info"

[[checks]]
id = "born-size"
description = "a NEW file (born in the working tree: added/untracked) arrives over the bound rule's `limit` lines — split per-scope before the burst's commit; born checked, no grandfathering"
severity = "error"
takes_limit = true

[[checks]]
id = "folder-size"
description = "a folder holds at most `limit` source files (its mod.rs and tests.rs excluded); the budget is the `limit` on the bound rule"
severity = "info"
takes_limit = true

[[checks]]
id = "name-cluster"
description = "files in one folder sharing a name token (`*_data.rs`, `cmd_*.rs`) at least `limit` times (default 3) are a folder that was never created"
severity = "info"
takes_limit = true

[[checks]]
id = "no-panic"
description = "production code in a bound rule's scope does not panic: no .unwrap()/.expect(/panic!/todo!/unimplemented! outside tests (opt-in: runs only where a rule binds it)"
severity = "error"

[[checks]]
id = "ownership"
description = "what a container `owns` (a capability type, a marker like #[op2) is constructed or declared only inside it; holding a capability elsewhere is fine"
severity = "error"

[[checks]]
id = "escape-hatch"
description = "every call of a declared escape hatch (container `escapes`, e.g. CheckedPath::unsafe_new) is counted — baseline them and let the count only fall"
severity = "error"

[[checks]]
id = "suppression-reason"
description = "every #[allow(...)]/#![allow(...)] carries reason = \"…\" (advisory until a rule binds it)"
severity = "error"
adopted_by_binding = true

[[checks]]
id = "banned-api"
description = "paths in the bound rule's `values` (e.g. std::fs::read) do not appear in its scope; `path => replacement` names the sanctioned path; `harna deny --clippy` writes both into each crate's clippy.toml"
severity = "error"
takes_values = true

[[checks]]
id = "cargo-layering"
description = "a crate's Cargo dependencies on workspace crates stay inside its layers plus their declared depends_on (the DAG holds before any import exists)"
severity = "error"

[[checks]]
id = "sync-group"
description = "the files in the bound rule's `values` yield the same ordered list from its `pattern` (capture group 1) — registration lists kept in sync as data"
severity = "error"
takes_values = true
takes_pattern = true

[[checks]]
id = "folder-entries"
description = "a folder (the rule's scope; none = the repo root) holds only the entries listed in `values` — a new entry is a decision"
severity = "error"
takes_values = true

[[checks]]
id = "file-header"
description = "files in scope with the extensions in `values` (default rs) begin with a line matching the rule's `pattern`"
severity = "error"
takes_values = true
takes_pattern = true

[[checks]]
id = "referenced-by"
description = "every file in the rule's scope (filtered by its `pattern` over file names) is referenced by name from some file under its `values` folders (no orphan fixtures)"
severity = "error"
takes_values = true
takes_pattern = true

[[checks]]
id = "ignore-reason"
description = "every #[ignore] test says why: #[ignore = \"…\"] (advisory until a rule binds it)"
severity = "error"
adopted_by_binding = true

[[checks]]
id = "count-pin"
description = "the count of a kind (values[0]: fn/struct/… or a marker like #[op2) in scope equals the pinned `limit`"
severity = "error"
takes_limit = true
takes_values = true

[[checks]]
id = "generated"
description = "the rule's scope is generated from its `values` sources: outputs skip size budgets; an output changed without its sources reads as a hand edit; the rule's `command` (the generator's check mode) is the proof harna's CI workflow runs — none named is advisory"
severity = "info"
takes_values = true

[[checks]]
id = "doc-claims"
description = "paths and registered-runner commands cited in AGENTS.md / CLAUDE.md / CONTRIBUTING.md / copilot-instructions exist"
severity = "info"

[[checks]]
id = "unreachable-module"
description = "a `.rs` file no crate target's module tree reaches (fixtures, Rust-shaped data) — read as data, skipped by every source check; declare it with `mod` if it is meant to compile"
severity = "info"

[[checks]]
id = "crate-conformity"
description = "every crate in the rule's scope carries what its `values` require: `file:NAME` (a companion file, e.g. BUILD.bazel) and `toml:KEY[ = VALUE]` (a Cargo.toml key, e.g. lints.workspace = true); named per crate"
severity = "error"
takes_values = true

[[checks]]
id = "unreferenced-snapshot"
description = "an insta `.snap` whose producing module (its `module__…` file-name prefix) the map no longer knows — not a file, not an inline mod: its test is gone; advisory until a rule binds it"
severity = "error"
adopted_by_binding = true

[[checks]]
id = "sibling-isolation"
description = "in a layer declared `isolated = true`, containers are peers that never import each other; they meet through a lower layer or a declared corridor"
severity = "error"

[[checks]]
id = "api-parity"
description = "paths into a crate an installed plugin mirrors resolve against the plugin's api.toml (generated from the release's source): an invented module or item is named with the version; glob re-exports are trusted"
severity = "info"

[[checks]]
id = "registry"
description = "project-wide (full validate only): names a declare:<regex> registers (group 1, comma-separated) must be used on another live line (use:<regex> with NAME); keys a bind:<regex> registers (group 1, scope group 2) must not repeat in one scope"
severity = "info"

[[checks]]
id = "code-pattern"
description = "the rule's regex over live code lines (comments and test items masked); values within:<regex> limits it to the block a matching line opens, unless:<regex> excuses a line - the generic engine plugin conventions bind (no plugin code runs)"
severity = "info"
takes_pattern = true

[[checks]]
id = "kind-coverage"
description = "every registered component in the rule's scope is named by a file of the test kind(s) the rule's values list (by module name, file stem or declared surface) - e.g. every view has a ui test"
severity = "info"

[[checks]]
id = "test-reach"
description = "files of a declared test kind (manifest [[test_kinds]]: path globs + reach) and crates' dev-dependencies cross only the layers their kind declares; no kinds declared, nothing runs"
severity = "error"

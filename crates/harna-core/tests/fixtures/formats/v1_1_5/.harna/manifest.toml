schema_version = 7

# harna manifest: layers -> containers -> components
# data schema version; upgrade with `harna migrate`
[[layers]]
name = "core"

[[layers.containers]]
name = "api"
path = "crates/api/src"

[[layers.containers]]
name = "events"
path = "crates/events/src"
provides = [
    "total",
    "Posted",
]
owners = ["@events"]

[[layers.containers]]
name = "sync"
path = "crates/sync/src"

[[layers]]
name = "ui"

[[layers.containers]]
name = "screens"
path = "web/src"

[[layers.containers.components]]
name = "calendar"
kind = "primitive"
path = "web/src/Calendar.tsx"
states = ["default", "disabled", "loading", "error"]
variants = ["full", "mini"]

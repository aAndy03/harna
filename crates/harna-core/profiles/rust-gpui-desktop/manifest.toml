schema_version = 1

# Layers of a gpui-kit desktop app, from the gpui-kit Coding Guides'
# "Architecture at a glance": dependencies point downward; the shell composes
# feature crates; a feature keeps one capability's model, views, commands and
# dialogs together and never reaches into a sibling feature; shared
# capabilities and platform seams sit below. Prune freely.

[[layers]]
name = "shell"
description = "the app shell: windows, menus, global actions; composes features and wires command handlers to services, holds little feature logic"
role = "interface"
depends_on = ["features", "ui", "services", "shared", "platform"]

[[layers.containers]]
name = "app"
path = "crates/app/src"
description = "main, window bootstrap, app-level state and composition"

[[layers]]
name = "features"
description = "one crate per capability (model + views + commands + dialogs); siblings meet through shared types, commands or events, never each other's internals"
depends_on = ["ui", "shared", "platform"]
isolated = true

[[layers]]
name = "ui"
description = "app components: repeated, domain-aware UI patterns built on gpui-kit components"
depends_on = ["shared"]

[[layers.containers]]
name = "components"
path = "crates/ui/src"
description = "domain-aware components reused by several features, and the menu engine: it alone builds menus, from the entries features contribute as data"
owns = ["gpui-kit:menus"]

[[layers]]
name = "shared"
description = "stable shared capabilities with more than one owner: domain types, ports, services — headless, no GPUI"

[[layers.containers]]
name = "core"
path = "crates/shared/src"
description = "shared domain types and ports (traits)"

[[layers.containers]]
name = "commands"
path = "crates/shared/src/commands"
description = "the command bus: named commands features dispatch and services handle; the one corridor from UI to use cases, kept thin"
role = "transit"
connects = ["features", "services"]

[[layers]]
name = "services"
description = "use cases: what the app does, behind the command bus; features never call them directly"
depends_on = ["shared", "platform"]

[[layers.containers]]
name = "use-cases"
path = "crates/services/src"
description = "command handlers and the domain operations they run, headless"

[[layers]]
name = "platform"
description = "narrow capability seams over the OS (files, network, notifications, clipboard), each with a defined fallback"
depends_on = ["shared"]

[[layers.containers]]
name = "os"
path = "crates/platform/src"
description = "adapters implementing shared ports for each target"
gateway = "fs, net, process"

# UI integration tests are their own kind: files carrying #[gpui_kit::test]
# (headless windows, simulated input). The rule views-have-ui-tests asks one
# for every view; plain unit tests stay outside layering.
[[test_kinds]]
name = "ui"
paths = ["crates/*/tests/**", "crates/*/src/**"]
contains = '#\[gpui_kit::test'
description = "gpui-kit UI integration tests (#[gpui_kit::test] + TestAppContext)"

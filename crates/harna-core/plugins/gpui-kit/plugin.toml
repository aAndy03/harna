# gpui-kit as a harna plugin: the framework's conventions and vocabulary
# as data, versioned with the gpui-kit release they mirror. harna's core
# keeps no gpui-kit knowledge; this pack does. Upgrade it with gpui-kit.
name = "gpui-kit"
description = "gpui-kit 0.8.0 conventions (Coding Guides, Testing guide) and vocabulary for Rust desktop apps"
version = "0.8.0-7"
sources = [
  "https://docs.rs/gpui-kit/0.8.0/gpui_kit/",
  "https://gpui-kit.com/docs/coding-guides.md",
  "https://gpui-kit.com/docs/getting-started.md",
]

[mirrors]
gpui-kit = "0.8.0"

# Capabilities a container can own (harna container set <c> --owns gpui-kit:raw-input):
# only the owner may call these; everyone else uses the high-level events
# (on_click, on_drag) or the owner's engine.
[capabilities]
raw-input = [
  "on_mouse_down(", "on_mouse_up(", "on_mouse_move(", "on_mouse_down_out(", "on_mouse_up_out(",
  "on_any_mouse_down(", "on_any_mouse_up(", "capture_any_mouse_down(", "capture_any_mouse_up(",
  "on_mouse_event(", "on_mouse_pressure(", "capture_mouse_pressure(", "on_mouse_exit(",
  "on_scroll_wheel(", "on_pinch(", "capture_pinch(",
]
# Menu construction: one engine builds menus from the entries features
# contribute as data; no feature builds a menu itself.
menus = [
  "PopupMenu::build(", "context_menu(", "dropdown_menu(", "dropdown_menu_with_anchor(",
]

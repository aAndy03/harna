# Tauri 2 as a harna plugin: the Rust<->TypeScript bridge as data. A
# #[tauri::command] fn is exposed to the webview; invoke('name') calls it.
# Each call becomes an edge in the map (bridge:<rust file>), so layers,
# dependents and parity see across the language line.
interface = 1
name = "tauri"
description = "Tauri 2 desktop apps: commands as cross-language edges, IPC behind one module"
version = "2.0-1"
sources = [
  "https://v2.tauri.app/develop/calling-rust/",
  "https://docs.rs/tauri/2/tauri/",
]

[mirrors]
tauri = "2.0.0"

[[bridges]]
name = "tauri-command"
rust = '#\[tauri::command'
ts = '''\binvoke(?:<[^>(]*>)?\(\s*['"`]NAME['"`]'''
